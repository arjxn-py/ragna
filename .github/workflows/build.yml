name: Build and Verify Packages

on:
  pull_request:
  push:
    branches:
      - release/*

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - ragna
          - ragna-base
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build toml setuptools_scm

      - name: Build distribution for ragna-base
        if: matrix.package == 'ragna-base'
        run: |
          echo "Building ragna-base package"
          python -m build
          echo "Build complete for ragna-base"

      - name: Upload ragna-base artifacts
        if: matrix.package == 'ragna-base'
        uses: actions/upload-artifact@v3
        with:
          name: ragna-base-dist
          path: dist/*.whl

      - name: Install ragna-base
        if: matrix.package == 'ragna-base'
        run: |
          pip install dist/*.whl
          pip check

      - name: Build distribution for ragna
        if: matrix.package == 'ragna'
        run: |
          echo "Building ragna package"
          python -m build --sdist --wheel --outdir ./dist ./meta-package
          echo "Build complete for ragna"

      - name: Upload ragna artifacts
        if: matrix.package == 'ragna'
        uses: actions/upload-artifact@v3
        with:
          name: ragna-dist
          path: dist/*.whl

      - name: Install ragna
        if: matrix.package == 'ragna'
        run: |
          pip install dist/*.whl
          pip check

      - name: Visualize dependency tree of built package
        run: |
          pip install pipdeptree
          pipdeptree -d 1
