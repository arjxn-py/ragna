name: docker-requirements

on:
  pull_request:
    paths:
      - ".github/workflows/update-docker-requirements.yml"
      - "pyproject.toml"
      - "requirements-docker.lock"
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.11"
          optional-dependencies: "false"

      - name: Verify setup-env step
        run: |
          echo "Python version: $(python --version)"
          echo "Pip version: $(pip --version)"
          pip list

      - name: Update docker requirements
        id: update
        run: |
          pip-compile \
            --quiet \
            --strip-extras --output-file=requirements-docker.lock \
            --extra=all pyproject.toml

          NEEDS_UPDATE=$(git diff --quiet && echo 'false' || echo 'true')
          echo "needs-update=${NEEDS_UPDATE}" | tee --append $GITHUB_OUTPUT

      - name: Commit changes if needed
        if: steps.update.outputs.needs-update == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add requirements-docker.lock
          git commit -m "Update requirements-docker.lock"
          git push origin ${{ github.head_ref }}

      - name: Show diff
        if: steps.update.outputs.needs-update == 'true'
        run: git diff --exit-code
